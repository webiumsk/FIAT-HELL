name: Build & Deploy Web Flasher

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache PlatformIO
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware (S3 + WT32)
        run: |
          pio run -e esp32-8048s050
          pio run -e esp32dev

      - name: Extract firmware version
        id: fwver
        run: |
          VER=$(grep 'define FW_VERSION' src/version.h | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "Firmware version: $VER"

      - name: Copy binaries to web-flasher/public/bin/
        run: |
          mkdir -p web-flasher/public/bin/s3 web-flasher/public/bin/wt32
          cp .pio/build/esp32-8048s050/bootloader.bin web-flasher/public/bin/s3/bootloader.bin
          cp .pio/build/esp32-8048s050/partitions.bin web-flasher/public/bin/s3/partitions.bin
          cp .pio/build/esp32-8048s050/firmware.bin   web-flasher/public/bin/s3/firmware.bin
          cp .pio/build/esp32dev/bootloader.bin       web-flasher/public/bin/wt32/bootloader.bin
          cp .pio/build/esp32dev/partitions.bin       web-flasher/public/bin/wt32/partitions.bin
          cp .pio/build/esp32dev/firmware.bin         web-flasher/public/bin/wt32/firmware.bin
          BOOT_APP0=$(find ~/.platformio -name "boot_app0.bin" | head -1)
          if [ -n "$BOOT_APP0" ]; then
            cp "$BOOT_APP0" web-flasher/public/bin/s3/boot_app0.bin
            cp "$BOOT_APP0" web-flasher/public/bin/wt32/boot_app0.bin
          else
            echo "WARN: boot_app0.bin nenájdený"
          fi

      - name: Prepare release assets (board-suffixed names)
        run: |
          mkdir -p release-assets
          cp web-flasher/public/bin/s3/bootloader.bin   release-assets/bootloader-s3.bin
          cp web-flasher/public/bin/s3/partitions.bin   release-assets/partitions-s3.bin
          cp web-flasher/public/bin/s3/firmware.bin     release-assets/firmware-s3.bin
          cp web-flasher/public/bin/wt32/bootloader.bin release-assets/bootloader-wt32.bin
          cp web-flasher/public/bin/wt32/partitions.bin release-assets/partitions-wt32.bin
          cp web-flasher/public/bin/wt32/firmware.bin   release-assets/firmware-wt32.bin
          cp web-flasher/public/bin/s3/boot_app0.bin    release-assets/boot_app0.bin

      - name: Inject firmware version into web-flasher
        run: |
          VER="${{ steps.fwver.outputs.version }}"
          sed -i "s/FW_VERSION_PLACEHOLDER/$VER/" web-flasher/src/config.js

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-flasher/package-lock.json

      - name: Build web flasher
        run: |
          cd web-flasher
          npm ci
          npm run build

      - name: Package offline flasher
        run: |
          mkdir -p offline-pkg
          cp -r web-flasher/dist/* offline-pkg/
          cp web-flasher/offline/start-windows.bat offline-pkg/
          cp web-flasher/offline/start-linux-mac.sh offline-pkg/
          cp web-flasher/offline/README.txt offline-pkg/
          chmod +x offline-pkg/start-linux-mac.sh
          (cd offline-pkg && zip -qr ../release-assets/fiat-hell-flasher-offline.zip .)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@e9c66a37f080288a11235e32cbe2dc5fb3a679cc  # peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-flasher/dist
          publish_branch: gh-pages
          commit_message: "Deploy web flasher v${{ steps.fwver.outputs.version }}"

      - name: Create GitHub Release with firmware assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # softprops/action-gh-release@v2
        with:
          files: |
            release-assets/bootloader-s3.bin
            release-assets/partitions-s3.bin
            release-assets/firmware-s3.bin
            release-assets/bootloader-wt32.bin
            release-assets/partitions-wt32.bin
            release-assets/firmware-wt32.bin
            release-assets/boot_app0.bin
            release-assets/fiat-hell-flasher-offline.zip
          generate_release_notes: true
          name: "v${{ steps.fwver.outputs.version }}"
          fail_on_unmatched_files: true
