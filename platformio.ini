; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-8048s050]
platform = espressif32
board = esp32-8048S050C
framework = arduino
extra_scripts = pre:pre_upload_disable_1200bps.py

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
upload_speed = 460800
; No auto-reset – manually: hold BOOT, press RESET, release, then run upload
upload_use_1200bps_touch = no
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_src_filter =
    +<*>
    -<minimal_boot_test.cpp>

build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_LOOP_STACK_SIZE=8192
    
    ; LVGL konfigurácia
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_COMP_CONF_INCLUDE_SIMPLE
    -I src/
    
    ; Základné LVGL nastavenia
    -DLV_COLOR_DEPTH=16
    -DLV_COLOR_16_SWAP=0
    -DLV_MEM_CUSTOM=1
    -DLV_MEM_SIZE='(64U * 1024U)'
    
    ; Fonty ktoré používaš
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_22=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_32=1
    -DLV_FONT_MONTSERRAT_48=1
    
    ; Extra widgets
    -DLV_USE_QRCODE=1

lib_deps = 
    lvgl/lvgl@8.1.0
    hieromon/AutoConnect@1.4.2
    jchristensen/JC_Button@^2.1.2
    stepansnigirev/uBitcoin@^0.2.0
    bblanchon/ArduinoJson@6.21.5
    tamctec/TAMC_GT911
    moononournation/GFX Library for Arduino

[env:esp32-8048s050-minimal]
platform = espressif32
board = esp32-8048S050C
framework = arduino
extra_scripts = pre:pre_upload_disable_1200bps.py

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
upload_speed = 460800
upload_use_1200bps_touch = no
monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_CDC_ON_BOOT=0

monitor_filters = default

build_src_filter =
    -<*>
    +<minimal_boot_test.cpp>