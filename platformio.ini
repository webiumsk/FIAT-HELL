; PlatformIO Project Configuration File
;
; Two hardware targets share one codebase:
;   esp32-8048s050  - Sunton ESP32-8048S050C (ESP32-S3, 800x480 RGB panel, 16MB)
;   esp32dev        - WT32-SC01 (ESP32, LovyanGFX, 4MB, no OTA)
; Board-specific code lives in src/boards/<board>/; everything else is shared.

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@8.1.0
    hieromon/AutoConnect@1.4.2
    jchristensen/JC_Button@^2.1.2
    stepansnigirev/uBitcoin@~0.2.0
    bblanchon/ArduinoJson@6.21.5

[env:esp32-8048s050]
platform = espressif32 @ ~6.7.0
board = esp32-8048S050C
extra_scripts = pre:pre_upload_disable_1200bps.py

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
upload_speed = 460800
; No auto-reset – manually: hold BOOT, press RESET, release, then run upload
upload_use_1200bps_touch = no
monitor_filters = esp32_exception_decoder

build_src_filter =
    +<*>
    -<boards/wt32/>
    -<boards/s3/minimal_boot_test.cpp>

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_LOOP_STACK_SIZE=8192

    ; LVGL konfigurácia
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_COMP_CONF_INCLUDE_SIMPLE
    -I src/
    -I src/boards/s3/

    ; Základné LVGL nastavenia
    -DLV_COLOR_DEPTH=16
    -DLV_COLOR_16_SWAP=0
    -DLV_MEM_CUSTOM=1
    -DLV_MEM_SIZE='(64U * 1024U)'

    ; Fonty ktoré používaš
    -DLV_FONT_MONTSERRAT_12=1
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_22=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_28=1
    -DLV_FONT_MONTSERRAT_32=1
    -DLV_FONT_MONTSERRAT_48=1

    ; Extra widgets
    -DLV_USE_QRCODE=1

lib_deps =
    ${env.lib_deps}
    tamctec/TAMC_GT911
    moononournation/GFX Library for Arduino @ 1.4.9

[env:esp32-8048s050-minimal]
platform = espressif32 @ ~6.7.0
board = esp32-8048S050C
extra_scripts = pre:pre_upload_disable_1200bps.py

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
upload_speed = 460800
upload_use_1200bps_touch = no

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_CDC_ON_BOOT=0

monitor_filters = default

build_src_filter =
    -<*>
    +<boards/s3/minimal_boot_test.cpp>

[env:esp32dev]
platform = espressif32
board = esp32dev
upload_speed = 921600
board_build.partitions = huge_app.csv
monitor_filters = esp32_exception_decoder

build_src_filter =
    +<*>
    -<boards/s3/>
    -<PriceBalanceTask.cpp>

build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -D LV_COMP_CONF_INCLUDE_SIMPLE  ; for components
    -I src/
    -DAUTOCONNECT_USE_LOG=1
    -DARDUINO_LOOP_STACK_SIZE=8192

lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^0.4.14
